# The parser against the public statistics of ~30 fresh matches, every Monday (cmd/audit, audit/).
# Valve's numbers must stay exact and no field may match worse than audit/baseline.json allows: a new hero,
# item or mechanic the parser miscounts fails this run, and GitHub mails the failure. The report is the
# run's summary and an artifact. Read-only: it downloads replays from Valve and asks OpenDota, nothing else.
name: audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          go build -o parser .
          go build -o audit-bin ./cmd/audit
      - name: pick 30 fresh matches
        # 30, not 20: a third or more of the downloads from Valve can fail on a GitHub runner
        run: ./audit-bin pick -dir work -n 30
      - name: fetch OpenDota answers and replays
        run: ./audit-bin fetch -dir work -wait 20m
      - name: compare
        run: ./audit-bin run -dir work -parser ./parser -baseline audit/baseline.json -title "Weekly audit"
      - name: summary
        if: always()
        run: test -f work/report.md && cat work/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: |
            work/report.md
            work/report.json
            work/checks-*.json
