app = "resoai-parse"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  MAX_CONCURRENT = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle — parse jobs are bursty, no need to pay when quiet.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# Parsing needs sustained CPU; shared CPU throttled production jobs past the deadline.
[[vm]]
  size = "performance-1x"
  memory = "2gb"
