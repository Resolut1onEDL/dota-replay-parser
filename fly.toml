app = "resoai-parse"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  MAX_CONCURRENT = "1"
  PORT = "8080"
  # Replay vault (Tigris): off until the bucket and secrets exist. After a deploy
  # scripts/release-sync.sh always brings the daily maintain machine to the new
  # image and env (RETENTION_APPLY, WEB_URL); it starts the re-parse of the stored
  # replays only when REPARSE_AUTO is 1 (keep 0 until the backfill is done).
  REPARSE_AUTO = "0"
  REPARSE_MACHINES = "8"
  REPARSE_MAX_RUNTIME = "150m"
  RETENTION_APPLY = "0"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle — parse jobs are bursty, no need to pay when quiet.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# Parsing needs sustained CPU; shared CPU throttled production jobs past the deadline.
[[vm]]
  size = "performance-1x"
  memory = "2gb"
